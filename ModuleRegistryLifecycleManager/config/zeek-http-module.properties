# Module Identity
module.id=zeek_http_01
module.name=Zeek HTTP NSM Module
module.type=network_security

# HTTP Listener Configuration
zeek.http.host=0.0.0.0
zeek.http.port=8091
zeek.http.path=/zeek/notices

# Alert Processing Configuration
# Minimum severity to process: low, medium, high, critical
zeek.min_severity=medium

# If true, process all Zeek notices regardless of type
# If false, only process security-relevant notices (ransomware, scans, exploits, etc.)
zeek.enable_all_notices=false
