# FooGuardStandaloneSkeleton configuration (evaluation kit)

# RabbitMQ / Message Bus
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.user=user
rabbitmq.password=password
rabbitmq.workflow_queue=workflow_queue

# FooGuard log file to tail.
# Repo-relative default so this works without any real FooGuard install - point this at a real
# path for an actual deployment.
foo.log_path=sample-data/foo.log

# Module identity
# module.id must match the config filename (without .properties) - see SKILL.md / the SDK
# usability audit for why this matters in the real system.
module.id=fooguard-module
module.name=FooGuard UDM (Evaluation Skeleton)
module.type=network_security
module.command_queue=fooguard-module_commands_queue

# Module capabilities (comma-separated)
module.capabilities=network_ids,alert_generation

# Heartbeat configuration (in seconds)
module.heartbeat_interval=30
