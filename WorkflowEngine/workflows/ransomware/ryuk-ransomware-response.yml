name: "Ryuk Ransomware Response"
version: 1.0
description: >
  Response for Ryuk ransomware detection by Zeek or Suricata.
  Triggers immediate network isolation via OpenDaylight and alerts the SOC.

trigger:
  event_type: "alerts.network.suricata"
  # Also applies to Zeek alerts if they match "ryuk"
  condition: "{{ trigger.payload.signature contains 'Ryuk' or trigger.payload.alert_type contains 'Ryuk' }}"

steps:
  - name: "Log Ryuk Ransomware Event"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "RANSOMWARE_DETECTED"
        data:
          event_id: "{{ trigger.event_id }}"
          source_ip: "{{ trigger.payload.source_ip }}"
          severity: "critical"
          alert_type: "Ransomware.Ryuk"
          signature: "{{ trigger.payload.signature }}"
          timestamp: "{{ trigger.timestamp }}"
          
  - name: "Initiate Host Network Isolation (ODL)"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "INITIATE_MITIGATION"
        data:
          targetHost: "{{ trigger.payload.source_ip }}"
          action: "ISOLATE_VLAN"
          sdn_controller: "opendaylight"
          priority: "high"
          justification: "Ryuk ransomware activity detected from {{ trigger.payload.source_ip }}. Automatically isolating host."
          source_event_id: "{{ trigger.event_id }}"

  - name: "Alert SOC"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "SOC_ALERT"
        data:
          alert_level: "critical"
          incident_type: "ryuk_ransomware_detection"
          affected_host: "{{ trigger.payload.source_ip }}"
          severity: "critical"
          action_taken: "HOST_ISOLATED"
          requires_investigation: true
          message: "CRITICAL: Ryuk ransomware detected emanating from {{ trigger.payload.source_ip }}. Action taken: OpenDaylight Host Isolation."
