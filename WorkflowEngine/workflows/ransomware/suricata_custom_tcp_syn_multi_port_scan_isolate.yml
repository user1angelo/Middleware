name: "Suricata Custom TCP SYN Multi-Port Scan -> SDN Isolation"
version: 1.0
description: >
  Isolates a suspicious source host when Suricata rule 9000009 detects TCP SYN scanning across many destination ports.

trigger:
  event_type: "alerts.network.suricata"
  condition: "{{ trigger.payload.signature_id == '9000009' }}"

steps:
  - name: "Isolate TCP SYN multi-port scanner"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "INITIATE_MITIGATION"
        data:
          targetHost: "{{ trigger.payload.source_ip }}"
          action: "ISOLATE_VLAN"
          justification: "Custom Suricata TCP SYN multi-port scan rule 9000009 detected from {{ trigger.payload.source_ip }}. Isolating suspicious machine."
          source_event_id: "{{ trigger.event_id }}"
          signature: "{{ trigger.payload.signature }}"
          signature_id: "{{ trigger.payload.signature_id }}"
