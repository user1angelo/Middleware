name: "SDN Block East-West Lateral Movement"
version: 1.0
description: >
  Block east-west (intra-VLAN/subnet) traffic for the infected host while allowing
  management traffic to approved subnets.

trigger:
  event_type: "alerts.host.wazuh"
  condition: "{{ trigger.payload.alert_type contains 'ransomware' }}"

steps:
  - name: "Deny east-west traffic, allow management only"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "INITIATE_MITIGATION"
        data:
          targetHost: "{{ trigger.payload.source_ip }}"
          hostId: "{{ trigger.payload.host_id }}"
          action: "BLOCK_LATERAL"
          sdn_controller: "opendaylight"
          allowlist_cidrs:
            - "192.168.100.0/24"
            - "192.168.200.0/24"
            - "192.168.210.0/24"
          duration: "until_cleared"
          priority: "high"
          justification: "Ransomware suspected. Blocking east-west lateral movement for infected host."
