name: "SDN Detect SMB Lateral Movement"
version: 1.0
description: >
  Detects suspicious lateral movement activities over SMB, such as WMI execution and ipconfig requests.
  These events often indicate ransomware propagation or attacker movement in the network.
  Triggers immediate network isolation via OpenDaylight and alerts the SOC.

trigger:
  event_type: "alerts.network.suricata"
  # Match any of the specific signatures seen in the telemetry regarding WMI / Ipconfig over SMB
  condition: "{{ trigger.payload.signature contains 'WMI .mof' or trigger.payload.signature contains 'Ipconfig Command in SMB' or trigger.payload.signature contains 'WMIC WMI Request' }}"

steps:
  - name: "Log Lateral Movement Event"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "LATERAL_MOVEMENT_DETECTED"
        data:
          event_id: "{{ trigger.event_id }}"
          source_ip: "{{ trigger.payload.source_ip }}"
          severity: "{{ trigger.payload.severity }}"
          alert_type: "LateralMovement.SMB"
          signature: "{{ trigger.payload.signature }}"
          timestamp: "{{ trigger.timestamp }}"
          
  - name: "Initiate Host Network Isolation (ODL)"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "INITIATE_MITIGATION"
        data:
          targetHost: "{{ trigger.payload.source_ip }}"
          action: "ISOLATE_VLAN"
          sdn_controller: "opendaylight"
          priority: "high"
          justification: "Suspicious SMB lateral movement ({{ trigger.payload.signature }}) detected from {{ trigger.payload.source_ip }}. Isolating host."
          source_event_id: "{{ trigger.event_id }}"

  - name: "Alert SOC"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "SOC_ALERT"
        data:
          alert_level: "high"
          incident_type: "smb_lateral_movement"
          affected_host: "{{ trigger.payload.source_ip }}"
          severity: "high"
          action_taken: "HOST_ISOLATED"
          requires_investigation: true
          message: "HIGH: Suspicious SMB lateral movement detected ({{ trigger.payload.signature }}) from {{ trigger.payload.source_ip }}. Automatically isolated via SDN."
