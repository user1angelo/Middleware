name: "Suricata Custom UDP DNS Port Flood -> SDN Isolation"
version: 1.0
description: >
  Isolates a suspicious source host when Suricata detects a UDP flood targeting DNS port 53.

trigger:
  event_type: "alerts.network.suricata"
  condition: "{{ trigger.payload.signature contains 'CUSTOM FLOOD UDP Flood - DNS Port Targeted' }}"

steps:
  - name: "Isolate UDP DNS flood offender"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "INITIATE_MITIGATION"
        data:
          targetHost: "{{ trigger.payload.source_ip }}"
          action: "ISOLATE_VLAN"
          justification: "Custom Suricata UDP DNS port flood signature detected from {{ trigger.payload.source_ip }}. Isolating suspicious machine."
          source_event_id: "{{ trigger.event_id }}"
          signature: "{{ trigger.payload.signature }}"
          signature_id: "{{ trigger.payload.signature_id }}"
