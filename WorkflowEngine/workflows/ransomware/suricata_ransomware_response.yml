name: "Suricata Ransomware Response"
version: 1.0
description: >
  Response for ransomware detected by Suricata NIDS.
  Triggers immediate network isolation via OpenDaylight.

trigger:
  event_type: "alerts.network.suricata"
  condition: "{{ trigger.payload.alert_type contains 'ransomware' }}"

steps:
  - name: "Log Suricata Ransomware Event"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "RANSOMWARE_DETECTED"
        data:
          event_id: "{{ trigger.event_id }}"
          source_ip: "{{ trigger.payload.source_ip }}"
          severity: "{{ trigger.payload.severity }}"
          alert_type: "{{ trigger.payload.alert_type }}"
          signature: "{{ trigger.payload.signature }}"
          timestamp: "{{ trigger.timestamp }}"
          
  - name: "Initiate Host Network Isolation (ODL)"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "INITIATE_MITIGATION"
        data:
          targetHost: "{{ trigger.payload.source_ip }}"
          action: "ISOLATE_VLAN"
          sdn_controller: "opendaylight"
          priority: "high"
          justification: "Suricata NIDS detected ransomware traffic from {{ trigger.payload.source_ip }} (Sig: {{ trigger.payload.signature }}). Isolating."
          source_event_id: "{{ trigger.event_id }}"

  - name: "Alert SOC"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "SOC_ALERT"
        data:
          alert_level: "critical"
          incident_type: "network_ransomware_detection"
          affected_host: "{{ trigger.payload.source_ip }}"
          severity: "{{ trigger.payload.severity }}"
          action_taken: "HOST_ISOLATED"
          requires_investigation: true
          message: "CRITICAL: Network Ransomware detected from {{ trigger.payload.source_ip }}. Automatically isolated via SDN."
