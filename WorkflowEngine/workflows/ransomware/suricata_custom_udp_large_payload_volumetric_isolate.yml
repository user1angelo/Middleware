name: "Suricata Custom UDP Large Payload Volumetric Pattern -> SDN Isolation"
version: 1.0
description: >
  Isolates a suspicious source host when Suricata detects repeated large-payload UDP volumetric traffic.

trigger:
  event_type: "alerts.network.suricata"
  condition: "{{ trigger.payload.signature contains 'CUSTOM FLOOD UDP Large Payload Volumetric Pattern' }}"

steps:
  - name: "Isolate UDP large-payload offender"
    action:
      type: "PUBLISH_EVENT"
      event:
        type: "INITIATE_MITIGATION"
        data:
          targetHost: "{{ trigger.payload.source_ip }}"
          action: "ISOLATE_VLAN"
          justification: "Custom Suricata UDP large-payload volumetric signature detected from {{ trigger.payload.source_ip }}. Isolating suspicious machine."
          source_event_id: "{{ trigger.event_id }}"
          signature: "{{ trigger.payload.signature }}"
          signature_id: "{{ trigger.payload.signature_id }}"
