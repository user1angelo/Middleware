# Module Identity
module.id=suricata_http_01
module.name=Suricata HTTP NIDS Module
module.type=network_security

# HTTP Listener Configuration
suricata.http.host=0.0.0.0
suricata.http.port=8090
suricata.http.path=/suricata/alerts

# Automated Isolation Configuration
suricata.auto_isolate.enabled=true
suricata.auto_isolate.min_threat_score=75
suricata.auto_isolate.severity_threshold=high
suricata.auto_isolate.categories=ransomware,apt_activity,c2_communication,malware
suricata.auto_isolate.cooldown_ms=120000
suricata.auto_isolate.cooldown.max_entries=5000

# Alert deduplication / anti-spam
suricata.alert_dedup.enabled=true
suricata.alert_dedup.window_ms=30000
suricata.alert_dedup.max_entries=5000
