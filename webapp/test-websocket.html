<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #0a0f1a; color: #fff; }
        #logs { background: #121929; padding: 20px; border: 1px solid #2d3748; border-radius: 8px; height: 400px; overflow-y: auto; }
        .log { margin-bottom: 8px; }
        .status { padding: 8px; margin-bottom: 20px; border-radius: 4px; }
        .connected { background: #48bb78; color: #000; }
        .disconnected { background: #fc8181; color: #000; }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <div id="status" class="status disconnected">Disconnected</div>
    <div id="logs"></div>

    <script>
        const socket = io('http://localhost:3001');
        const statusEl = document.getElementById('status');
        const logsEl = document.getElementById('logs');

        function addLog(msg) {
            const div = document.createElement('div');
            div.className = 'log';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logsEl.appendChild(div);
            logsEl.scrollTop = logsEl.scrollHeight;
        }

        socket.on('connect', () => {
            statusEl.textContent = 'Connected: ' + socket.id;
            statusEl.className = 'status connected';
            addLog('✅ Connected to server');
        });

        socket.on('disconnect', () => {
            statusEl.textContent = 'Disconnected';
            statusEl.className = 'status disconnected';
            addLog('❌ Disconnected from server');
        });

        socket.on('process-log', (data) => {
            addLog(`[${data.process}] ${data.message}`);
        });

        socket.on('rabbitmq-log', (data) => {
            addLog(`[RabbitMQ - ${data.queue}] ${JSON.stringify(data.message).substring(0, 100)}`);
        });

        addLog('🔄 Attempting to connect...');
    </script>
</body>
</html>
