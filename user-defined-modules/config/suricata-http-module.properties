# Suricata HTTP Module (SDK Plugin) configuration

# HTTP endpoint where Suricata (or a forwarder) will POST JSON alerts
suricata.http.host=0.0.0.0
suricata.http.port=8090
suricata.http.path=/suricata/alerts

# Module identity
# These values are used for logging and identification inside the SDK-based
# ModuleRegistry & Lifecycle Manager.
module.id=suricata-http-module
module.name=Suricata HTTP NIDS Module
module.type=network_security
