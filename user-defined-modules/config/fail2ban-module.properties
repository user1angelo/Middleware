# Fail2banModule configuration

# RabbitMQ / Message Bus
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.user=user
rabbitmq.password=password
rabbitmq.workflow_queue=workflow_queue

# Fail2ban log file to tail.
# Default is repo-relative so the demo works without a real fail2ban install - the module
# doesn't care whether a real fail2ban wrote a line or a simulator script appended it.
# For a real deployment, point this at fail2ban's actual log file instead:
#   fail2ban.log_path=/var/log/fail2ban/fail2ban.log
fail2ban.log_path=simulated_logs/fail2ban.log

# Module identity
# IMPORTANT: module.id must match the config filename (without .properties)
# so the web dashboard can correlate DB records with this config.
module.id=fail2ban-module
module.name=Fail2ban UDM
module.type=host_security
module.command_queue=fail2ban-module_commands_queue

# Module capabilities (used for workflow routing)
module.capabilities=brute_force_detection,alert_generation

# Heartbeat configuration (in seconds)
module.heartbeat_interval=30
