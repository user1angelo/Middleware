# MaltrailModule configuration

# RabbitMQ / Message Bus
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.user=user
rabbitmq.password=password
rabbitmq.workflow_queue=workflow_queue

# Maltrail UDP listener configuration
# Point Maltrail's sensor at this host:port via maltrail.conf:
#   LOGSTASH_SERVER <this-host>:<this-port>
maltrail.udp_port=8481

# Module identity
# IMPORTANT: module.id must match the config filename (without .properties)
# so the web dashboard can correlate DB records with this config.
module.id=maltrail-module
module.name=Maltrail UDM
module.type=network_security
module.command_queue=maltrail-module_commands_queue

# Module capabilities (used for workflow routing)
module.capabilities=network_ids,threat_intel,alert_generation

# Heartbeat configuration (in seconds)
module.heartbeat_interval=30
