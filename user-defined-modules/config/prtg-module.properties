# PRTGModule configuration

# RabbitMQ / Message Bus
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.user=user
rabbitmq.password=password
rabbitmq.workflow_queue=workflow_queue

listeners.tcp.default = 5672         
listeners.ssl.default = 5671          

ssl_options.cacertfile = /etc/rabbitmq/ca_cert.pem     
ssl_options.certfile   = /etc/rabbitmq/server_cert.pem
ssl_options.keyfile    = /etc/rabbitmq/server_key.pem

# Strongly recommended for mutual TLS and proper verification:
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true

# HTTP endpoint where PRTG will send notifications
prtg.http.host=0.0.0.0
prtg.http.port=8085
prtg.http.path=/prtg/alerts

# Module identity
# IMPORTANT: module.id must match the config filename (without .properties)
# so the web dashboard can correlate DB records with this config.
module.id=prtg-module
module.name=PRTG Monitoring Module
module.type=network_monitoring
module.command_queue=prtg-module_commands_queue
