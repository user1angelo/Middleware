# SysmonModule configuration

# RabbitMQ / Message Bus
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.user=user
rabbitmq.password=password
rabbitmq.workflow_queue=workflow_queue

# Sysmon UDP listener configuration.
# Point a Winlogbeat/NXLog-style JSON shipper at this host:port to forward Sysmon
# Event Log entries (Process Create / File Create) here.
sysmon.udp_port=8482

# Module identity
# IMPORTANT: module.id must match the config filename (without .properties)
# so the web dashboard can correlate DB records with this config.
module.id=sysmon-module
module.name=Sysmon UDM
module.type=host_security
module.command_queue=sysmon-module_commands_queue

# Module capabilities (used for workflow routing)
module.capabilities=host_telemetry,process_monitoring,alert_generation

# Heartbeat configuration (in seconds)
module.heartbeat_interval=30
